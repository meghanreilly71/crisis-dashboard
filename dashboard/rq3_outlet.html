<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RQ3 — Frame prevalence by outlet</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
<style>
  :root { --bg:#ffffff; --fg:#16181d; --muted:#5c6370; --line:#e3e6ea; --accent:#4269d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaed; --muted:#9aa2ad; --line:#2a2e35; --accent:#97bbf5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:28px 24px 56px; background:var(--bg); color:var(--fg);
         font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:-0.01em; }
  .sub { color:var(--muted); font-size:14px; margin:0 0 20px; }
  .controls { display:flex; flex-wrap:wrap; gap:20px; align-items:center; margin-bottom:16px; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button { appearance:none; border:0; background:transparent; color:var(--fg);
                padding:7px 16px; font-size:14px; cursor:pointer; }
  .seg button[aria-selected="true"] { background:var(--accent); color:#fff; }
  .panel { border:1px solid var(--line); border-radius:10px; padding:14px 16px 6px; }
  .panel .meta { color:var(--muted); font-size:13px; margin:0 0 6px; }
  .chart-scroll { overflow-x:auto; }
  .chart { min-width:1000px; }
  .caption { font-size:13px; color:var(--muted); border-top:1px solid var(--line);
             margin-top:10px; padding:11px 2px 8px; }
  .caption p { margin:0 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>RQ3 &middot; Frame prevalence by outlet</h1>
  <p class="sub">Share of each outlet's articles where the frame is present, all
     years combined. Click a legend entry to hide or show that outlet.</p>

  <div class="controls">
    <div class="seg" role="tablist" id="corpusToggle">
      <button role="tab" data-corpus="climate" aria-selected="true">Climate</button>
      <button role="tab" data-corpus="migration" aria-selected="false">Migration</button>
    </div>
  </div>

  <div class="panel">
    <p class="meta" id="meta"></p>
    <div class="chart-scroll"><div id="chart" class="chart"></div></div>
    <div class="caption" id="caption">
      <p id="thinNote"></p>
    </div>
  </div>
</div>

<script>
const DATA = {"climate": {"frames": ["conflict", "human_interest", "economic", "deservingness", "responsibility", "scientific", "crisis", "solutions", "victim", "skepticism", "securitization", "othering", "agency"], "frame_labels": ["Conflict", "Human Interest", "Economic", "Deservingness", "Responsibility", "Scientific", "Crisis", "Solutions", "Victim", "Skepticism", "Securitization", "Othering", "Agency"], "caveat": [false, false, false, false, false, false, true, true, false, false, false, false, false], "outlets": ["AD", "FD", "NRC", "Telegraaf", "Trouw", "Volkskrant"], "colors": ["#4269d0", "#efb118", "#a463f2", "#3ca951", "#ff725c", "#17becf"], "outlet_n": [278, 139, 119, 76, 258, 199], "n_total": 1069, "has_thin": false, "series": {"AD": {"pct": [57.554, 46.0432, 51.0791, 8.6331, 90.6475, 41.3669, 56.4748, 83.4532, 26.259, 13.3094, 38.4892, 5.036, 100.0], "np": [160, 128, 142, 24, 252, 115, 157, 232, 73, 37, 107, 14, 278], "na": [278, 278, 278, 278, 278, 278, 278, 278, 278, 278, 278, 278, 278]}, "FD": {"pct": [84.1727, 13.6691, 85.6115, 5.7554, 90.6475, 45.3237, 54.6763, 87.0504, 17.2662, 30.9353, 42.446, 8.6331, 97.8417], "np": [117, 19, 119, 8, 126, 63, 76, 121, 24, 43, 59, 12, 136], "na": [139, 139, 139, 139, 139, 139, 139, 139, 139, 139, 139, 139, 139]}, "NRC": {"pct": [71.4286, 35.2941, 62.1849, 13.4454, 89.916, 58.8235, 63.0252, 86.5546, 26.8908, 17.6471, 45.3782, 15.1261, 97.479], "np": [85, 42, 74, 16, 107, 70, 75, 103, 32, 21, 54, 18, 116], "na": [119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119, 119]}, "Telegraaf": {"pct": [65.7895, 23.6842, 71.0526, 7.8947, 88.1579, 53.9474, 59.2105, 68.4211, 28.9474, 38.1579, 44.7368, 15.7895, 97.3684], "np": [50, 18, 54, 6, 67, 41, 45, 52, 22, 29, 34, 12, 74], "na": [76, 76, 76, 76, 76, 76, 76, 76, 76, 76, 76, 76, 76]}, "Trouw": {"pct": [80.2326, 33.7209, 60.0775, 14.3411, 93.0233, 59.6899, 67.0543, 81.3953, 29.4574, 22.4806, 53.876, 10.0775, 98.8372], "np": [207, 87, 155, 37, 240, 154, 173, 210, 76, 58, 139, 26, 255], "na": [258, 258, 258, 258, 258, 258, 258, 258, 258, 258, 258, 258, 258]}, "Volkskrant": {"pct": [74.3719, 38.6935, 57.7889, 16.0804, 81.9095, 62.3116, 64.8241, 66.8342, 34.1709, 25.6281, 55.7789, 14.0704, 96.4824], "np": [148, 77, 115, 32, 163, 124, 129, 133, 68, 51, 111, 28, 192], "na": [199, 199, 199, 199, 199, 199, 199, 199, 199, 199, 199, 199, 199]}}}, "migration": {"frames": ["conflict", "human_interest", "economic", "deservingness", "responsibility", "humanitarian", "security", "policy", "securitization", "othering", "agency"], "frame_labels": ["Conflict", "Human Interest", "Economic", "Deservingness", "Responsibility", "Humanitarian", "Security", "Policy", "Securitization", "Othering", "Agency"], "caveat": [false, false, false, false, false, false, true, false, false, false, false], "outlets": ["AD", "FD", "NRC", "Telegraaf", "Trouw", "Volkskrant"], "colors": ["#4269d0", "#efb118", "#a463f2", "#3ca951", "#ff725c", "#17becf"], "outlet_n": [1215, 162, 172, 508, 663, 258], "n_total": 2978, "has_thin": false, "series": {"AD": {"pct": [68.0658, 44.0329, 26.6667, 48.4774, 78.6008, 47.1605, 27.9835, 86.0082, 10.8642, 41.9753, 97.6132], "np": [827, 535, 324, 589, 955, 573, 340, 1045, 132, 510, 1186], "na": [1215, 1215, 1215, 1215, 1215, 1215, 1215, 1215, 1215, 1215, 1215]}, "FD": {"pct": [83.3333, 25.3086, 64.1975, 45.679, 82.0988, 35.1852, 50.6173, 93.8272, 27.1605, 58.642, 98.1481], "np": [135, 41, 104, 74, 133, 57, 82, 152, 44, 95, 159], "na": [162, 162, 162, 162, 162, 162, 162, 162, 162, 162, 162]}, "NRC": {"pct": [84.8837, 48.2558, 37.7907, 55.814, 84.8837, 65.6977, 40.6977, 91.8605, 28.4884, 57.5581, 99.4186], "np": [146, 83, 65, 96, 146, 113, 70, 158, 49, 99, 171], "na": [172, 172, 172, 172, 172, 172, 172, 172, 172, 172, 172]}, "Telegraaf": {"pct": [85.8268, 33.6614, 36.4173, 56.2992, 85.2362, 34.8425, 58.6614, 85.6299, 31.1024, 69.2913, 98.4252], "np": [436, 171, 185, 286, 433, 177, 298, 435, 158, 352, 500], "na": [508, 508, 508, 508, 508, 508, 508, 508, 508, 508, 508]}, "Trouw": {"pct": [87.0287, 52.0362, 32.73, 58.371, 81.2971, 60.4827, 40.2715, 87.7828, 25.7919, 58.0694, 99.095], "np": [577, 345, 217, 387, 539, 401, 267, 582, 171, 385, 657], "na": [663, 663, 663, 663, 663, 663, 663, 663, 663, 663, 663]}, "Volkskrant": {"pct": [86.4341, 50.3876, 37.9845, 62.7907, 87.5969, 64.7287, 38.3721, 89.9225, 25.1938, 64.3411, 98.8372], "np": [223, 130, 98, 162, 226, 167, 99, 232, 65, 166, 255], "na": [258, 258, 258, 258, 258, 258, 258, 258, 258, 258, 258]}}}};
let corpus = 'climate';

function render() {
  const d = DATA[corpus];
  const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const fg = dark ? '#e8eaed' : '#16181d';
  const muted = dark ? '#9aa2ad' : '#5c6370';
  const grid = dark ? '#2a2e35' : '#e3e6ea';

  // no reliability marker on the labels; the tier data stays in the payload
  const xLabels = d.frame_labels.slice();

  // Legend swatches come from empty proxy traces, never from the bar traces
  // themselves: per-bar opacity/pattern arrays would otherwise be sampled at
  // index 0 and become the legend icon (the RQ2 legend bug).
  const proxies = d.outlets.map((o, i) => ({
    type: 'scatter', mode: 'markers', name: o, legendgroup: o,
    x: [null], y: [null],
    marker: { size: 11, symbol: 'square', color: d.colors[i] },
    showlegend: true, hoverinfo: 'skip'
  }));

  const bars = d.outlets.map((o, i) => {
    const s = d.series[o];
    return {
      type: 'bar', name: o, legendgroup: o, showlegend: false,
      x: xLabels, y: s.pct,
      customdata: s.na.map((n, j) => [s.np[j], n]),
      marker: {
        color: d.colors[i],
        // low-confidence cells: faded + hatched. Never fires on the current
        // data (every outlet total is >= 76) but is kept so a future rerun
        // with a thinner corpus cannot silently plot them at full weight.
        opacity: s.na.map(n => n < 10 ? 0.45 : 1),
        pattern: { shape: s.na.map(n => n < 10 ? '/' : ''), size: 5, solidity: 0.35 }
      },
      hovertemplate: '%{y:.1f}%  \u00b7  %{customdata[0]}/%{customdata[1]} articles'
    };
  });

  Plotly.react('chart', proxies.concat(bars), {
    height: 540,
    margin: { l: 62, r: 150, t: 10, b: 116 },
    barmode: 'group', bargap: 0.28, bargroupgap: 0.06,
    paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)',
    font: { color: fg, size: 12 },
    xaxis: { type: 'category', tickangle: -38, gridcolor: grid,
             tickfont: { size: 11.5, color: fg }, automargin: true },
    yaxis: { title: { text: '% of articles with frame present',
                      font: { size: 12.5, color: muted } },
             range: [0, 104], tick0: 0, dtick: 20, ticksuffix: '%',
             gridcolor: grid, zeroline: false, tickfont: { color: fg } },
    hovermode: 'x unified',
    hoverlabel: { bgcolor: dark ? '#20242b' : '#ffffff', bordercolor: grid,
                  font: { size: 11.5, color: fg } },
    legend: { orientation: 'v', x: 1.01, xanchor: 'left', y: 1,
              font: { size: 11.5, color: fg } }
  }, { displayModeBar: false, responsive: true });

  document.getElementById('meta').textContent =
    d.n_total.toLocaleString() + ' articles \u00b7 ' + d.outlets.length +
    ' outlets \u00b7 ' + d.frames.length + ' frames \u00b7 ' + corpus + ' corpus (' +
    d.outlets.map((o, i) => o + ' ' + d.outlet_n[i]).join(', ') + ')';

  // Only says anything when there is actually something to flag; when no cell
  // is thin the paragraph is emptied and hidden rather than stating a negative.
  const note = document.getElementById('thinNote');
  note.textContent = d.has_thin
    ? 'Faded, hatched bars rest on fewer than 10 articles and should not be read as estimates.'
    : '';
  note.style.display = d.has_thin ? '' : 'none';
  // the thin note is now the caption's only content, so hide the whole block
  // (and its top border) rather than leave an empty bordered box
  document.getElementById('caption').style.display = d.has_thin ? '' : 'none';
}

document.getElementById('corpusToggle').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  corpus = b.dataset.corpus;
  [...e.currentTarget.querySelectorAll('button')].forEach(x =>
    x.setAttribute('aria-selected', String(x === b)));
  render();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);

render();
</script>
</body>
</html>
